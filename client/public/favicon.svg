<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The lens mark at tab size: the 16px entry of the design's size ladder.
    The highlight arc is gone and the strokes are thickened — at 16px the glass
    and its handle are all that read.

    A favicon has no element to inherit from, so the disc carries the indigo
    literally rather than as currentColor, and the media query supplies the
    dark-theme value the app gets from the primary token.

    Note this is an XML comment: a double hyphen inside one is a parse error,
    and Chrome renders the error page rather than the mark.
  -->
  <style>
    .disc { fill: #455492 }
    @media (prefers-color-scheme: dark) { .disc { fill: #6E81CF } }
  </style>
  <circle class="disc" cx="16" cy="16" r="16"/>
  <g transform="translate(5 5) scale(0.6875)" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round">
    <circle cx="13.8" cy="13.8" r="8.5"/>
    <path d="M19.7 19.7 L26.2 26.2"/>
  </g>
</svg>
