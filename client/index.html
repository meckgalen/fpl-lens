<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FPL Lens</title>

    <!--
      The theme, applied before first paint.

      Without this the `dark` class lands in React's first effect, so a dark user
      sees a light page on every reload. Adding a `system` default made that
      worse rather than better: a dark device would flash light on a FIRST visit
      too, having never chosen anything.

      What it buys depends on the build, which is worth knowing before measuring
      it. `index.css` is imported from `main.tsx`, so in dev Vite injects it
      through JavaScript and a flash remains whatever this script does. The
      production build extracts it to a render-blocking `<link>` in this head,
      and only there is the class already on `<html>` when the first paint
      happens. Check it against `npm run build && npm run preview`.

      THE RULE BELOW IS DUPLICATED from `readStoredMode` and `resolveTheme` in
      `src/lib/theme.ts`. It has to be: this runs before any module loads and so
      cannot import. Change one side and change the other —
      `src/test/prepaint.test.ts` extracts this script from this file and fails
      if the two disagree on any case.

      The unrecognised-value fallback is the `raw === …` chain, not the catch.
      The catch is for localStorage being unavailable at all (private mode,
      cookies disabled), which is a different failure: a throw here would leave
      the document with no class and no error anyone would think to look for.
    -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('fpl-theme');
          var mode = raw === 'light' || raw === 'dark' || raw === 'system' ? raw : 'system';
          var dark =
            mode === 'system'
              ? window.matchMedia('(prefers-color-scheme: dark)').matches
              : mode === 'dark';
          document.documentElement.classList.toggle('dark', dark);
        } catch (e) {}
      })();
    </script>

    <!--
      The lens mark at tab size. The SVG is the 16px variant — no highlight,
      thickened strokes — and carries its own prefers-color-scheme rule, since a
      favicon has no element to inherit the theme's indigo from.

      The PNG is the 48px variant rasterised, because iOS ignores SVG favicons
      and does not composite a transparent one onto anything sensible.
    -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!--
      The two image origins: player photographs and club badges come from
      resources.premierleague.com, club shirts from fantasy.premierleague.com.
      Two links, because they are two origins.

      This moves DNS and the TLS handshake to page load, before any image URL is
      known — which is the whole point, since the first image request cannot
      start until React has rendered a row.

      What they appear to buy is ~141 ms. That is the gap from a controlled A/B —
      6 pairs, these links present vs absent, one cold socket-pool partition per
      sample — where the present arm's cold first request medianed 393.5 ms and
      the absent arm's 534.5 ms, present faster in 4 of 6 pairs.

      Do NOT read ~155 ms as that figure. It is ~395 ms cold WITH these links
      against ~240 ms warm, i.e. the residual cost still paid after the
      preconnect, not what the preconnect removes. The two are close enough to
      swap by accident, and an earlier version of this comment did.

      The A/B's pre-committed rule returned "not resolvable at N=6" — but it
      tested the between-arm difference against the within-arm RANGE, which one
      1321 ms outlier fixed at 962 ms, so nothing under about half a second could
      have resolved. That is a verdict about the statistic, not about the links.
      A paired design should be tested on its paired differences; theirs median
      143.5 ms.

      Neither takes `crossorigin`. Images are fetched in no-CORS mode, and a
      crossorigin preconnect opens a CORS connection the image request will not
      reuse — it would warm the wrong socket and cost a second handshake. The
      fonts link above keeps its crossorigin because fonts genuinely are CORS.
    -->
    <link rel="preconnect" href="https://resources.premierleague.com" />
    <link rel="preconnect" href="https://fantasy.premierleague.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
